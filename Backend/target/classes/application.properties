# Server Configuration
server.port=8080
server.servlet.context-path=/

# Spring Application Name
spring.application.name=circular-marketplace-backend

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/circular_marketplace?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# JWT Configuration
app.jwt.secret=9a0e7e3c2b1d4f6a8c5e2b0d1a3f7c9e6b2d4a1f8e5c2b9a7d0f3e6c9b2e5a
app.jwt.expiration=86400000
app.jwt.refresh-expiration=604800000

# Frontend Configuration
app.frontend.url=http://localhost:5173

# Email Configuration (Gmail SMTP)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your-email@gmail.com
spring.mail.password=your-app-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.from=noreply@circularmarketplace.com

# Logging
logging.level.root=INFO
logging.level.com.example.backend=DEBUG
